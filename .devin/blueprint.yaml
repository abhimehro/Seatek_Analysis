# https://docs.devin.ai/onboard-devin/environment-yaml
initialize: |
  set -e
  # Install R 4.3.3 and build dependencies. CRAN's Ubuntu archive only keeps the
  # current R release, so install the pinned version from Posit's r-builds CDN
  # and symlink R/Rscript into /usr/local/bin.
  sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl gnupg ca-certificates software-properties-common \
    build-essential gfortran libcurl4-openssl-dev libxml2-dev libssl-dev \
    libfontconfig1-dev libharfbuzz-dev libfribidi-dev libuv1-dev \
    libzip-dev zlib1g-dev libgit2-dev pandoc cmake
  # deadsnakes PPA provides python3.12 on Ubuntu 22.04; tolerated if unavailable.
  sudo DEBIAN_FRONTEND=noninteractive add-apt-repository -y ppa:deadsnakes/ppa || true
  sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3.12 python3.12-venv python3-pip || true
  # Posit r-builds: download the Ubuntu 22.04 binary package and install it with apt
  # so dependencies are resolved from Ubuntu's repositories. SHA-256 hashes are pinned
  # to verify the downloaded artifact before apt installs it.
  R_VERSION=4.3.3
  ARCH=$(dpkg --print-architecture)
  R_DEB="r-${R_VERSION}_1_${ARCH}.deb"
  case "$ARCH" in
    amd64) R_SHA256="dde20cc255a1c5627ec5ed84c8d3b24f094b4b0459b363e96c137fb98220bae5" ;;
    arm64) R_SHA256="5349604db30056bd8b40ab32518ea002bd748bcecff9e56b0ad4415981d3776e" ;;
    *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
  esac
  curl -fsSL -o "/tmp/${R_DEB}" "https://cdn.posit.co/r/ubuntu-2204/pkgs/${R_DEB}"
  printf "%s  /tmp/%s\n" "$R_SHA256" "$R_DEB" | sha256sum -c -
  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "/tmp/${R_DEB}"
  sudo ln -sf /opt/R/${R_VERSION}/bin/R /usr/local/bin/R
  sudo ln -sf /opt/R/${R_VERSION}/bin/Rscript /usr/local/bin/Rscript
  R --version
  Rscript --version
maintenance: |
  # Install renv into the project library and restore packages from renv.lock using Posit PPM binaries.
  Rscript --no-init-file -e 'lib <- file.path("renv/library", paste0("R-", format(getRversion()[1, 1:2])), R.version$platform); dir.create(lib, recursive = TRUE, showWarnings = FALSE); install.packages("renv", repos = "https://packagemanager.posit.co/cran/__linux__/jammy/latest", lib = lib)'
  Rscript -e "options(renv.config.repos.override = c(CRAN = 'https://packagemanager.posit.co/cran/__linux__/jammy/latest')); renv::restore()"
  # Create an isolated Python 3.11/3.12 venv for the optional Series 27 outlier script and Python tests.
  PYTHON_BIN=""
  for py in python3.12 python3.11 python3; do
    if command -v "$py" &>/dev/null && "$py" -c "import sys; sys.exit(0 if (3, 11) <= sys.version_info[:2] <= (3, 12) else 1)" 2>/dev/null; then
      PYTHON_BIN="$py"
      break
    fi
  done
  if [ -n "$PYTHON_BIN" ]; then
    test -d "${HOME}/.venvs/seatek_series27" || "$PYTHON_BIN" -m venv "${HOME}/.venvs/seatek_series27"
    "${HOME}/.venvs/seatek_series27/bin/python" -m pip install -U pip
    "${HOME}/.venvs/seatek_series27/bin/python" -m pip install -r Series_27/Analysis/requirements.txt
    "${HOME}/.venvs/seatek_series27/bin/python" -m pip install -r requirements-dev.txt
  else
    echo "Warning: No Python 3.11/3.12 interpreter found; skipping optional Series 27 venv setup." >&2
  fi
knowledge:
  - name: test
    contents: |
      R: ./run_tests.sh
      Python: ${HOME}/.venvs/seatek_series27/bin/python -m pytest tests/
  - name: run
    contents: |
      Rscript Updated_Seatek_Analysis.R
  - name: python-outlier
    contents: |
      ${HOME}/.venvs/seatek_series27/bin/python Series_27/Analysis/outlier_analysis_series27.py -i Series_27/Analysis/Seatek_Comprehensive_Analysis.xlsx -o /tmp/s27_out
  - name: lint
    contents: |
      R: Rscript -e "library(lintr); lint_dir('.', exclusions = list('renv/', 'backups/', 'Series_27/Analysis/venv/', 'implementation/'))"
      Python: ${HOME}/.venvs/seatek_series27/bin/python -m ruff check .
  - name: notes
    contents: |
      This blueprint targets Ubuntu 22.04 (jammy) images. R 4.3.3 is installed from Posit r-builds to match renv.lock (CRAN's Ubuntu archive only ships the current R release). Posit PPM provides fast binary installs for jammy. The tracked Series_27/Analysis/venv is a macOS placeholder with broken symlinks; use ${HOME}/.venvs/seatek_series27 instead. renv may warn that microbenchmark is used but not recorded (tests/test_perf_sapply_vs_lapply.R); this is harmless.
